name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Pack HACS bundle
        run: npm run pack

      - name: Verify HACS package
        run: node ../scripts/verify-hacs-package.mjs

      - name: Upload HACS bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: hacs-toggle-card
          path: dist/hacs-toggle-card.js
